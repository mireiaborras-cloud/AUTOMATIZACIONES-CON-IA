<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00A499">
<title>Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--
  Práctica · app de repaso tipo Duolingo para los bancos de ejercicios que genera Preguntas Test.
  Una sola app para todos los bancos: ?banco=nombre carga bancos/nombre.json. Sin servidor ni IA:
  el progreso de cada alumno (lecciones, XP, racha y fallos) se guarda en su navegador.
-->
<style>
:root{
  --c:#00A499; --c-osc:color-mix(in srgb,var(--c) 75%,#000); --c-suave:color-mix(in srgb,var(--c) 14%,#fff);
  --verde:#58CC02; --verde-osc:#58A700; --verde-suave:#D7FFB8; --verde-txt:#3B7A00;
  --rojo:#FF4B4B; --rojo-osc:#EA2B2B; --rojo-suave:#FFDFE0; --rojo-txt:#C42B2B;
  --azul:#1CB0F6; --azul-osc:#1899D6; --azul-suave:#DDF4FF;
  --oro:#FFC800; --oro-osc:#E5A800;
  --borde:#E5E5E5; --borde-osc:#CECECE; --tx:#3C3C3C; --tx2:#777; --fondo:#fff;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo);color:var(--tx);font:700 17px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
/* botones 3D */
.b3{border:2px solid var(--borde);border-bottom-width:4px;border-radius:16px;background:#fff;padding:12px 16px;font-weight:800;transition:transform .05s,filter .15s;text-align:left}
.b3:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.b3:hover{filter:brightness(.98)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--c);box-shadow:0 4px 0 var(--c-osc);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.verde{background:var(--verde);box-shadow:0 4px 0 var(--verde-osc)}
.btn.rojo{background:var(--rojo);box-shadow:0 4px 0 var(--rojo-osc)}
.btn.gris{background:#E5E5E5;color:#AFAFAF;box-shadow:0 4px 0 #CECECE;cursor:not-allowed}
.btn.blanco{background:#fff;color:var(--azul);border:2px solid var(--borde);box-shadow:0 4px 0 var(--borde)}
.btn.ancho{width:100%}

/* barra superior del camino */
.barra{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--borde)}
.barra .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.barra .tit{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.barra .tit b{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .ico{font-size:28px;line-height:1}
.chipst{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;white-space:nowrap}
.chipst.racha{color:#FF9600}.chipst.xp{color:var(--azul)}
.ibtn{background:none;border:0;padding:6px;border-radius:10px;font-size:20px;line-height:1}
.ibtn:hover{background:#F2F2F2}

/* biblioteca */
.hero{padding:32px 0 8px;text-align:center}
.hero h1{font-size:30px;font-weight:900;margin:0 0 6px}
.hero p{color:var(--tx2);margin:0}
.lista{display:flex;flex-direction:column;gap:12px;padding:20px 0 40px}
.banco{display:flex;gap:14px;align-items:center;width:100%;padding:16px}
.banco .bi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--bc-s);flex:none}
.banco b{display:block;font-size:18px}
.banco span{display:block;color:var(--tx2);font-size:14.5px;font-weight:700}
.vacio{color:var(--tx2);text-align:center;padding:24px 0}
.subir{display:block;text-align:center;color:var(--azul);font-weight:800;padding:8px;cursor:pointer}

/* camino */
.aviso{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--azul-suave);color:#1172A6;font-size:15px}
.fallos{display:flex;gap:12px;align-items:center;width:100%;margin-top:16px;padding:14px 16px;border-color:#FFC1C1;background:#FFF5F5}
.fallos .fi{font-size:28px}.fallos b{display:block}.fallos span{font-size:14px;color:var(--tx2)}
.unidad{margin:22px 0 10px}
.uhead{background:var(--c);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 4px 0 var(--c-osc)}
.uhead small{display:block;font-weight:900;letter-spacing:.08em;opacity:.85;font-size:13px}
.uhead h2{margin:2px 0 4px;font-size:21px;font-weight:900;line-height:1.2}
.uhead span{font-size:14.5px;opacity:.95}
.nodos{display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 10px}
.nodo{position:relative;width:76px;height:70px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--c-osc);color:#fff;font-size:30px;display:grid;place-items:center;transition:transform .05s}
.nodo:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c-osc)}
.nodo.hecho{background:var(--oro);box-shadow:0 7px 0 var(--oro-osc)}
.nodo.cerrado{background:#E5E5E5;box-shadow:0 7px 0 #B7B7B7;color:#AFAFAF}
.nodo.repaso{border-radius:22px}
.nodo .burbuja{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#fff;color:var(--c);border:2px solid var(--borde);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:900;letter-spacing:.06em;white-space:nowrap;animation:flota 1.2s ease-in-out infinite alternate}
.nodo .burbuja::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff}
@keyframes flota{to{transform:translate(-50%,-5px)}}
.nodo.actual::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--c-suave)}
@media(prefers-reduced-motion:reduce){.nodo .burbuja{animation:none}}

/* lección */
.lec{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:18px 16px 8px;max-width:760px;margin:0 auto;width:100%}
.pbar{flex:1;height:16px;border-radius:99px;background:#E5E5E5;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.vidas{color:var(--rojo);font-weight:900;font-size:18px;white-space:nowrap}
.cuerpo{flex:1;width:100%;max-width:640px;margin:0 auto;padding:18px 16px 200px;display:flex;flex-direction:column;gap:18px}
.etq{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--c);text-transform:uppercase}
.enun{font-size:23px;font-weight:900;margin:0;line-height:1.3}
.img{align-self:center;max-width:100%;max-height:260px;border-radius:16px;border:2px solid var(--borde);background:#fff}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;font-size:17px}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--borde);display:grid;place-items:center;font-size:14px;color:var(--tx2);flex:none}
.opt.sel,.chip.sel,.par.sel{border-color:#84D8FF;background:var(--azul-suave);color:#1899D6}
.opt.sel .k{border-color:#84D8FF;color:#1899D6}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-size:19px;padding:18px}
.tarjeta{border:2px solid var(--borde);border-radius:16px;padding:18px;font-size:19px}
.frase{font-size:21px;line-height:2;margin:0}
.hueco{display:inline-block;min-width:110px;border-bottom:3px solid var(--borde-osc);text-align:center;padding:0 8px;line-height:1.5;cursor:pointer}
.hueco.lleno{border:2px solid var(--borde);border-bottom-width:4px;border-radius:12px;padding:2px 12px;color:#1899D6;background:var(--azul-suave)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;font-size:17px}
.chip.usado{visibility:hidden}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pares .col{display:flex;flex-direction:column;gap:12px}
.par{width:100%;font-size:15.5px;padding:12px;text-align:center;min-height:58px}
.par.ok{border-color:var(--verde);background:var(--verde-suave);color:var(--verde-txt);opacity:.6;cursor:default}
.par.mal{border-color:var(--rojo);background:var(--rojo-suave);color:var(--rojo-txt);animation:tiembla .35s}
@keyframes tiembla{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.zona{min-height:120px;border-top:2px solid var(--borde);border-bottom:2px solid var(--borde);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.zona:empty::before{content:"Pulsa los pasos en el orden correcto";color:#AFAFAF;font-weight:700;text-align:center;padding-top:30px}
.paso{display:flex;gap:10px;align-items:center;width:100%;font-size:16px;padding:10px 14px}
.paso .n{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.banco-pasos{display:flex;flex-direction:column;gap:8px}
/* pie de la lección: comprobar y corrección */
.pie{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--borde);background:#fff;z-index:30}
.pie .in{max-width:760px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pie.ok{background:var(--verde-suave);border-top-color:transparent}
.pie.mal{background:var(--rojo-suave);border-top-color:transparent}
.pie h3{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.pie.ok h3,.pie.ok .sol{color:var(--verde-txt)}
.pie.mal h3,.pie.mal .sol{color:var(--rojo-txt)}
.pie .sol{font-size:16px;margin:0}
.pie .exp{font-size:15px;margin:0;color:var(--tx);font-weight:700;opacity:.85}
.pie ol,.pie ul{margin:4px 0 0;padding-left:1.3em}
@media(min-width:700px){.pie .in{flex-direction:row;align-items:center;justify-content:space-between}.pie .in .txt{flex:1}.pie .btn{min-width:180px}}
/* fin */
.fin{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;text-align:center}
.fin .grande{font-size:84px;line-height:1;animation:bota .7s ease-out}
@keyframes bota{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.fin h1{margin:0;font-size:30px;font-weight:900;color:var(--oro-osc)}
.fin.mal h1{color:var(--rojo-osc)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:460px}
.res div{border:2px solid var(--borde);border-radius:16px;overflow:hidden}
.res small{display:block;background:var(--c);color:#fff;font-size:12.5px;font-weight:900;letter-spacing:.06em;padding:5px}
.res b{display:block;font-size:22px;padding:10px 4px}
.fin .btn{width:100%;max-width:460px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:20px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.mbox h2{margin:0;font-size:22px;font-weight:900}
.mbox p{margin:0;color:var(--tx2)}
.mbox input{font:700 17px var(--f);padding:12px 14px;border:2px solid var(--borde);border-radius:14px;width:100%}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#4B4B4B;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:15px;max-width:90vw;text-align:center}
.pieweb{color:#AFAFAF;font-size:13px;text-align:center;padding:20px 0 30px;font-weight:700}
</style>
</head>
<body>
<header class="barra" id="barra" hidden><div class="wrap">
  <button class="ibtn" id="aBiblio" type="button" aria-label="Volver a la biblioteca">←</button>
  <div class="tit"><span class="ico" id="bIco"></span><b id="bTit"></b></div>
  <span class="chipst racha" id="sRacha" title="Días seguidos practicando"></span>
  <span class="chipst xp" id="sXp" title="Puntos de experiencia"></span>
  <button class="ibtn" id="bSonido" type="button" aria-label="Sonido"></button>
</div></header>
<main id="app"></main>
<div class="modal" id="mNombre" hidden><div class="mbox" role="dialog" aria-labelledby="mNt">
  <h2 id="mNt">¿Cómo te llamas?</h2><p>Tu profesor recibirá el resultado de cada lección con este nombre.</p>
  <input type="text" id="inNombre" maxlength="60" autocomplete="name" placeholder="Nombre y apellidos">
  <button class="btn ancho" id="okNombre" type="button">Continuar</button>
</div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fBanco" accept=".json" hidden>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
const LSG = (k, d) => { try { const v = localStorage.getItem('practica_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const LSS = (k, v) => { try { localStorage.setItem('practica_' + k, JSON.stringify(v)); } catch {} };
let _tt; function toast(m, ms = 2600) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(_tt); _tt = setTimeout(() => t.hidden = true, ms); }
const dia = d => d.toLocaleDateString('sv-SE');

/* ── banco y progreso ── */
let B = null, BID = '', BASE = null, PROG = null, L = null, EJ = null, PREVIA = false;
const TIPO = {opcion_multiple: 'mc', verdadero_falso: 'vf', completar: 'completar', emparejar: 'emparejar', ordenar: 'ordenar', imagen: 'imagen', mc: 'mc', vf: 'vf'};
function valido(q) {
  if (['mc', 'imagen', 'completar', 'vf'].includes(q.tipo)) return Array.isArray(q.opciones) && q.opciones.length >= 2 && Number.isInteger(q.correcta) && q.correcta >= 0 && q.correcta < q.opciones.length && (q.tipo !== 'completar' || String(q.frase || '').includes('___')) && (q.tipo !== 'imagen' || !!q.imagen);
  if (q.tipo === 'emparejar') return Array.isArray(q.pares) && q.pares.length >= 2 && q.pares.every(p => p && p.a && p.b);
  if (q.tipo === 'ordenar') return Array.isArray(q.pasos) && q.pasos.length >= 2;
  return false;
}
function normaliza(j) {
  if (j?.formato !== 'banco-preguntas' || !Array.isArray(j.temas)) throw new Error('El archivo no es un banco de ejercicios válido.');
  const p = j.presentacion || {};
  const temas = j.temas.map((t, i) => ({id: String(t.id || 't' + i), titulo: t.titulo || `Tema ${i + 1}`, ej: (t.ejercicios || t.preguntas || []).map((q, k) => ({...q, id: String(q.id || `${i}-${k}`), tipo: TIPO[q.tipo] || 'mc'})).filter(valido)})).filter(t => t.ej.length);
  if (!temas.length) throw new Error('El banco no tiene ejercicios.');
  return {titulo: p.titulo || j.libro?.titulo || 'Banco de ejercicios', descripcion: p.descripcion || '', icono: p.icono || '📘', color: /^#[0-9a-f]{6}$/i.test(p.color || '') ? p.color : '#00A499',
    porLeccion: Math.min(20, Math.max(3, +p.porLeccion || 8)), temas, imagenes: j.imagenes || {}, resultados: /^https:\/\//.test(j.resultados?.url || '') ? j.resultados.url : ''};
}
const srcImg = id => { const s = B.imagenes[id] || id; if (/^data:image\//.test(s)) return s; try { return new URL(s, BASE || location.href).href; } catch { return ''; } };
const _lec = new Map();
function lecciones(t) {
  if (_lec.has(t.id)) return _lec.get(t.id);
  const ord = {facil: 0, media: 1, dificil: 2}, qs = [...t.ej].sort((a, b) => (ord[a.dificultad] ?? 1) - (ord[b.dificultad] ?? 1)), n = B.porLeccion, out = [];
  for (let i = 0; i < qs.length; i += n) out.push(qs.slice(i, i + n));
  if (out.length > 1 && out.at(-1).length < Math.ceil(n / 2)) { const u = out.pop(); out[out.length - 1].push(...u); }
  _lec.set(t.id, out); return out;
}
const todos = () => B.temas.flatMap(t => t.ej);
const guardaProg = () => LSS('prog_' + BID, PROG);
const hecha = (t, li) => !!PROG.hechas[`${t.id}:${li}`];
function racha() { const r = PROG.racha, hoy = dia(new Date()), ayer = dia(new Date(Date.now() - 864e5)); return r.ultimo === hoy || r.ultimo === ayer ? r.dias : 0; }
function sumaRacha() { const r = PROG.racha, hoy = dia(new Date()), ayer = dia(new Date(Date.now() - 864e5)); if (r.ultimo === hoy) return; r.dias = r.ultimo === ayer ? r.dias + 1 : 1; r.ultimo = hoy; }
const fallosVivos = () => { const ids = new Set(todos().map(q => q.id)); return PROG.fallos.filter(id => ids.has(id)); };

/* ── sonido ── */
let _ac = null;
function tono(ok) {
  if (LSG('sonido', true) === false) return;
  try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); const t = _ac.currentTime, notas = ok ? [[660, 0], [880, .09]] : [[220, 0], [180, .12]];
    notas.forEach(([f, d]) => { const o = _ac.createOscillator(), g = _ac.createGain(); o.type = ok ? 'sine' : 'square'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(ok ? .25 : .08, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .18); o.connect(g).connect(_ac.destination); o.start(t + d); o.stop(t + d + .2); }); } catch {}
}
function pintaSonido() { $('bSonido').textContent = LSG('sonido', true) === false ? '🔇' : '🔊'; }
$('bSonido').onclick = () => { LSS('sonido', LSG('sonido', true) === false); pintaSonido(); };

/* ══ Biblioteca ══ */
async function verBiblioteca() {
  $('barra').hidden = true; document.title = 'Práctica'; const app = $('app');
  app.innerHTML = `<div class="wrap"><div class="hero"><h1>¿Qué quieres practicar?</h1><p>Elige un banco de ejercicios.</p></div><div class="lista" id="lista"><p class="vacio">Cargando…</p></div><label class="subir" for="fBanco">Abrir un banco desde un archivo (.json)</label><p class="pieweb">Tu progreso se guarda en este navegador.</p></div>`;
  let cat = [];
  try { const r = await fetch(new URL('../bancos/index.json', location.href), {cache: 'no-cache'}); if (r.ok) cat = (await r.json()).bancos || []; } catch {}
  cat = cat.filter(b => b && /^[\w-]+$/.test(b.archivo || ''));
  $('lista').innerHTML = cat.length ? cat.map(b => { const col = /^#[0-9a-f]{6}$/i.test(b.color || '') ? b.color : '#00A499', pr = LSG('prog_' + b.archivo, null), n = pr ? Object.keys(pr.hechas || {}).length : 0;
    return `<a class="b3 banco" href="?banco=${encodeURIComponent(b.archivo)}" style="--bc-s:color-mix(in srgb,${col} 18%,#fff);text-decoration:none;color:inherit"><span class="bi">${esc(b.icono || '📘')}</span><span><b>${esc(b.titulo || b.archivo)}</b><span>${esc(b.descripcion || '')}${n ? ` · ${n} lecciones hechas` : ''}</span></span></a>`; }).join('')
    : '<p class="vacio">No hay bancos publicados todavía. Abre el enlace que te ha dado tu profesor.</p>';
}
$('fBanco').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const j = normaliza(JSON.parse(await f.text())); abreBanco(j, 'local-' + slug(j.titulo), null); } catch (err) { toast(err.message, 4000); }
};
$('aBiblio').onclick = () => { if (PREVIA) { window.close(); return; } history.pushState(null, '', location.pathname); verBiblioteca(); };

/* ══ Camino ══ */
function abreBanco(b, id, base) {
  B = b; BID = id; BASE = base; _lec.clear();
  PROG = LSG('prog_' + BID, null) || {xp: 0, racha: {dias: 0, ultimo: ''}, hechas: {}, fallos: []};
  document.documentElement.style.setProperty('--c', B.color); document.querySelector('meta[name=theme-color]').content = B.color; document.title = B.titulo;
  verCamino();
}
function pintaBarra() {
  $('barra').hidden = false; $('bIco').textContent = B.icono; $('bTit').textContent = B.titulo;
  $('sRacha').textContent = '🔥 ' + racha(); $('sXp').textContent = '⚡ ' + PROG.xp; pintaSonido();
}
const OFF = [0, 46, 70, 46, 0, -46, -70, -46];
function verCamino() {
  L = null; pintaBarra(); window.scrollTo({top: 0});
  let actualPuesto = false, k = 0;
  const unidades = B.temas.map((t, ti) => {
    const ls = lecciones(t), nh = ls.filter((_, li) => hecha(t, li)).length;
    const nodos = ls.map((_, li) => {
      const est = hecha(t, li) ? 'hecho' : (li === 0 || hecha(t, li - 1)) ? 'abierto' : 'cerrado', actual = est === 'abierto' && !actualPuesto; if (actual) actualPuesto = true;
      return `<button class="nodo ${est}${actual ? ' actual' : ''}" style="left:${OFF[k++ % OFF.length]}px" data-t="${ti}" data-l="${li}" type="button" aria-label="Lección ${li + 1}${est === 'cerrado' ? ' (bloqueada)' : est === 'hecho' ? ' (completada)' : ''}">${actual ? `<span class="burbuja">${nh ? 'SIGUIENTE' : 'EMPEZAR'}</span>` : ''}${est === 'hecho' ? '★' : est === 'cerrado' ? '🔒' : '▶'}</button>`;
    }).join('');
    const rest = nh === ls.length ? (PROG.hechas[`${t.id}:R`] ? 'hecho' : 'abierto') : 'cerrado';
    const rep = `<button class="nodo repaso ${rest}" style="left:${OFF[k++ % OFF.length]}px" data-t="${ti}" data-l="R" type="button" aria-label="Repaso del tema">${rest === 'cerrado' ? '🔒' : '🏆'}</button>`;
    return `<section class="unidad"><div class="uhead"><small>TEMA ${ti + 1}</small><h2>${esc(t.titulo)}</h2><span>${nh} de ${ls.length} lecciones · ${t.ej.length} ejercicios</span></div><div class="nodos">${nodos}${rep}</div></section>`;
  }).join('');
  const nf = fallosVivos().length;
  $('app').innerHTML = `<div class="wrap">${PREVIA ? '<p class="aviso">Vista previa: así verán el banco tus alumnos. Todavía no está publicado.</p>' : ''}${B.descripcion ? `<p class="aviso" style="background:var(--c-suave);color:var(--c-osc)">${esc(B.descripcion)}</p>` : ''}
    ${nf ? `<button class="b3 fallos" id="bFallos" type="button"><span class="fi">💪</span><span><b>Repasa tus fallos</b><span>${nf} ejercicio${nf > 1 ? 's' : ''} para volver a intentar</span></span></button>` : ''}
    ${unidades}<p class="pieweb">Tu progreso se guarda en este navegador.</p></div>`;
  $('app').querySelectorAll('.nodo').forEach(n => n.onclick = () => {
    if (n.classList.contains('cerrado')) { toast(n.dataset.l === 'R' ? 'Completa todas las lecciones del tema para desbloquear el repaso' : 'Completa antes la lección anterior'); return; }
    empieza(n.dataset.l === 'R' ? 'repaso' : 'leccion', +n.dataset.t, n.dataset.l === 'R' ? 'R' : +n.dataset.l);
  });
  if ($('bFallos')) $('bFallos').onclick = () => empieza('fallos');
}

/* ══ Lección ══ */
function empieza(tipo, ti = null, li = null) {
  let qs;
  if (tipo === 'fallos') { const f = new Set(fallosVivos()); qs = shuffle(todos().filter(q => f.has(q.id))).slice(0, 10); }
  else if (tipo === 'repaso') qs = shuffle([...B.temas[ti].ej]).slice(0, 10);
  else qs = [...lecciones(B.temas[ti])[li]];
  if (!qs.length) return;
  L = {tipo, ti, li, cola: qs, i: 0, n: qs.length, vidas: 5, cerradas: 0, primeras: 0, intentos: new Map(), fallados: new Set(), t0: Date.now()};
  if (B.resultados && !LSG('alumno', '')) { pideNombre(() => pintaLeccion()); return; }
  pintaLeccion();
}
function pideNombre(sigue) {
  $('mNombre').hidden = false; $('inNombre').value = ''; setTimeout(() => $('inNombre').focus(), 50);
  const ok = () => { const n = $('inNombre').value.trim(); if (n.length < 2) { $('inNombre').focus(); return; } LSS('alumno', n); $('mNombre').hidden = true; sigue(); };
  $('okNombre').onclick = ok; $('inNombre').onkeydown = e => { if (e.key === 'Enter') ok(); };
}
function pintaLeccion() {
  $('barra').hidden = true; $('toast').hidden = true; window.scrollTo({top: 0});
  $('app').innerHTML = `<div class="lec"><div class="ltop"><button class="ibtn" id="salir" type="button" aria-label="Salir de la lección">✕</button><div class="pbar" role="progressbar" aria-label="Progreso"><span id="pb"></span></div><span class="vidas" id="vidas"></span></div>
    <div class="cuerpo" id="cuerpo"></div><div class="pie" id="pie"><div class="in" id="pieIn"></div></div></div>`;
  $('salir').onclick = () => { if (confirm('¿Salir de la lección? Perderás el progreso de esta lección.')) verCamino(); };
  pintaEjercicio();
}
const ETQ = {mc: 'Elige la respuesta correcta', imagen: 'Mira la imagen', vf: '¿Verdadero o falso?', completar: 'Completa la frase', emparejar: 'Empareja', ordenar: 'Ordena los pasos'};
function pintaEjercicio() {
  const q = L.cola[L.i];
  $('pb').style.width = Math.round(L.cerradas / L.n * 100) + '%'; $('vidas').textContent = '❤️ ' + L.vidas;
  EJ = {q, sel: null, hecho: false};
  const c = $('cuerpo'); let h = `<div class="etq">${ETQ[q.tipo]}</div>`;
  if (q.tipo === 'mc' || q.tipo === 'imagen') {
    EJ.orden = shuffle(q.opciones.map((_, i) => i));
    h += `<h2 class="enun">${esc(q.enunciado)}</h2>${q.tipo === 'imagen' ? `<img class="img" src="${esc(srcImg(q.imagen))}" alt="Imagen del ejercicio">` : ''}<div class="opts">${EJ.orden.map((i, k) => `<button class="b3 opt" data-o="${i}" type="button"><span class="k">${k + 1}</span><span>${esc(q.opciones[i])}</span></button>`).join('')}</div>`;
  } else if (q.tipo === 'vf') {
    h += `<div class="tarjeta">${esc(q.enunciado)}</div><div class="vf"><button class="b3 opt" data-o="0" type="button">✔ ${esc(q.opciones[0] || 'Verdadero')}</button><button class="b3 opt" data-o="1" type="button">✘ ${esc(q.opciones[1] || 'Falso')}</button></div>`;
  } else if (q.tipo === 'completar') {
    EJ.orden = shuffle(q.opciones.map((_, i) => i)); const [a, b] = String(q.frase).split('___');
    h += `${q.enunciado && !/^completa/i.test(q.enunciado) ? `<h2 class="enun">${esc(q.enunciado)}</h2>` : ''}<p class="frase">${esc(a)}<span class="hueco" id="hueco" role="button" tabindex="0" aria-label="Hueco">&nbsp;</span>${esc(b ?? '')}</p><div class="chips">${EJ.orden.map(i => `<button class="b3 chip" data-o="${i}" type="button">${esc(q.opciones[i])}</button>`).join('')}</div>`;
  } else if (q.tipo === 'emparejar') {
    EJ.izq = shuffle(q.pares.map((_, i) => i)); EJ.der = shuffle(q.pares.map((_, i) => i)); EJ.L = null; EJ.R = null; EJ.ok = new Set(); EJ.fallos = 0;
    h += `<h2 class="enun">${esc(q.enunciado || 'Une cada término con su definición')}</h2><div class="pares"><div class="col">${EJ.izq.map(i => `<button class="b3 par" data-l="${i}" type="button">${esc(q.pares[i].a)}</button>`).join('')}</div><div class="col">${EJ.der.map(i => `<button class="b3 par" data-r="${i}" type="button">${esc(q.pares[i].b)}</button>`).join('')}</div></div>`;
  } else if (q.tipo === 'ordenar') {
    do { EJ.orden = shuffle(q.pasos.map((_, i) => i)); } while (q.pasos.length > 1 && EJ.orden.every((v, i) => v === i));
    EJ.puestos = [];
    h += `<h2 class="enun">${esc(q.enunciado || 'Ordena los pasos')}</h2><div class="zona" id="zona"></div><div class="banco-pasos" id="bpasos"></div>`;
  }
  c.innerHTML = h;
  if (q.tipo === 'ordenar') pintaOrden();
  c.querySelectorAll('[data-o]').forEach(b => b.onclick = () => elige(+b.dataset.o));
  if ($('hueco')) $('hueco').onclick = () => { if (!EJ.hecho && EJ.sel != null) elige(null); };
  c.querySelectorAll('[data-l],[data-r]').forEach(b => b.onclick = () => pulsaPar(b));
  pieNeutro();
}
function elige(o) {
  if (EJ.hecho) return; EJ.sel = o; const q = EJ.q;
  $('cuerpo').querySelectorAll('[data-o]').forEach(b => { const s = +b.dataset.o === o; b.classList.toggle('sel', s && q.tipo !== 'completar'); if (q.tipo === 'completar') b.classList.toggle('usado', s); });
  if (q.tipo === 'completar') { const h = $('hueco'); h.textContent = o == null ? ' ' : q.opciones[o]; h.classList.toggle('lleno', o != null); }
  pieNeutro();
}
function pintaOrden() {
  const q = EJ.q;
  $('zona').innerHTML = EJ.puestos.map((i, k) => `<button class="b3 paso" data-quita="${k}" type="button"><span class="n">${k + 1}</span>${esc(q.pasos[i])}</button>`).join('');
  $('bpasos').innerHTML = EJ.orden.filter(i => !EJ.puestos.includes(i)).map(i => `<button class="b3 paso" data-pon="${i}" type="button">${esc(q.pasos[i])}</button>`).join('');
  $('zona').querySelectorAll('[data-quita]').forEach(b => b.onclick = () => { if (EJ.hecho) return; EJ.puestos.splice(+b.dataset.quita, 1); pintaOrden(); pieNeutro(); });
  $('bpasos').querySelectorAll('[data-pon]').forEach(b => b.onclick = () => { if (EJ.hecho) return; EJ.puestos.push(+b.dataset.pon); pintaOrden(); pieNeutro(); });
}
function pulsaPar(b) {
  if (EJ.hecho || b.classList.contains('ok')) return;
  const lado = b.dataset.l != null ? 'L' : 'R', v = +(b.dataset.l ?? b.dataset.r);
  EJ[lado] = EJ[lado] === v ? null : v;
  $('cuerpo').querySelectorAll('[data-l]').forEach(x => x.classList.toggle('sel', +x.dataset.l === EJ.L));
  $('cuerpo').querySelectorAll('[data-r]').forEach(x => x.classList.toggle('sel', +x.dataset.r === EJ.R));
  if (EJ.L == null || EJ.R == null) return;
  const bl = $('cuerpo').querySelector(`[data-l="${EJ.L}"]`), br = $('cuerpo').querySelector(`[data-r="${EJ.R}"]`);
  [bl, br].forEach(x => x.classList.remove('sel'));
  if (EJ.L === EJ.R) { [bl, br].forEach(x => x.classList.add('ok')); EJ.ok.add(EJ.L); tono(true); }
  else { EJ.fallos++; [bl, br].forEach(x => { x.classList.add('mal'); setTimeout(() => x.classList.remove('mal'), 450); }); tono(false); }
  EJ.L = EJ.R = null;
  if (EJ.ok.size === EJ.q.pares.length) resuelve(EJ.fallos === 0);
}
const puedeComprobar = () => { const q = EJ.q; if (q.tipo === 'ordenar') return EJ.puestos.length === q.pasos.length; if (q.tipo === 'emparejar') return false; return EJ.sel != null; };
function pieNeutro() {
  const p = $('pie'); p.className = 'pie';
  if (EJ.q.tipo === 'emparejar') { $('pieIn').innerHTML = `<p class="exp" style="text-align:center;width:100%">Pulsa un término y después su pareja.</p>`; return; }
  const ok = puedeComprobar();
  $('pieIn').innerHTML = `<span class="txt"></span><button class="btn ${ok ? 'verde' : 'gris'}" id="accion" type="button" ${ok ? '' : 'aria-disabled="true"'}>Comprobar</button>`;
  $('accion').onclick = () => { if (puedeComprobar()) comprueba(); };
}
function comprueba() {
  const q = EJ.q; let ok;
  if (q.tipo === 'ordenar') ok = EJ.puestos.every((v, i) => v === i);
  else ok = EJ.sel === q.correcta;
  resuelve(ok);
}
function solucionHTML(q) {
  if (q.tipo === 'completar') { const [a, b] = String(q.frase).split('___'); return `<p class="sol">${esc(a)}<u>${esc(q.opciones[q.correcta])}</u>${esc(b ?? '')}</p>`; }
  if (q.tipo === 'ordenar') return `<ol class="sol">${q.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
  if (q.tipo === 'emparejar') return `<ul class="sol">${q.pares.map(p => `<li>${esc(p.a)} → ${esc(p.b)}</li>`).join('')}</ul>`;
  return `<p class="sol">${esc(q.opciones[q.correcta])}</p>`;
}
const BIEN = ['¡Correcto!', '¡Muy bien!', '¡Genial!', '¡Perfecto!', '¡Así se hace!'];
function resuelve(ok) {
  if (EJ.hecho) return; EJ.hecho = true; const q = EJ.q, primera = !L.intentos.has(q.id);
  L.intentos.set(q.id, (L.intentos.get(q.id) || 0) + 1);
  /* un fallo solo sale de «Repasa tus fallos» cuando se acierta a la primera en otra lección, no al repetirlo en la misma */
  if (ok) { L.cerradas++; if (primera) { L.primeras++; PROG.fallos = PROG.fallos.filter(id => id !== q.id); } }
  else { L.vidas--; L.fallados.add(q.id); if (!PROG.fallos.includes(q.id)) PROG.fallos.push(q.id); PROG.fallos = PROG.fallos.slice(-300); if (primera) L.cola.push(q); else L.cerradas++; }
  if (q.tipo !== 'emparejar') tono(ok); else if (!ok) tono(false);
  guardaProg();
  $('cuerpo').querySelectorAll('button').forEach(b => b.disabled = true);
  $('pb').style.width = Math.round(L.cerradas / L.n * 100) + '%'; $('vidas').textContent = '❤️ ' + L.vidas;
  const p = $('pie'); p.className = 'pie ' + (ok ? 'ok' : 'mal');
  const titulo = ok ? (q.tipo === 'emparejar' && EJ.fallos ? '¡Hecho!' : BIEN[Math.floor(Math.random() * BIEN.length)]) : q.tipo === 'emparejar' ? `Hecho, con ${EJ.fallos} fallo${EJ.fallos > 1 ? 's' : ''}` : 'Solución correcta:';
  $('pieIn').innerHTML = `<div class="txt" role="status"><h3>${ok ? '✅' : '❌'} ${esc(titulo)}</h3>${!ok && q.tipo !== 'emparejar' ? solucionHTML(q) : ''}${q.explicacion ? `<p class="exp">${esc(q.explicacion)}</p>` : ''}</div><button class="btn ${ok ? 'verde' : 'rojo'}" id="accion" type="button">Continuar</button>`;
  $('accion').onclick = sigue; $('accion').focus();
}
function sigue() {
  if (L.vidas <= 0) return sinVidas();
  L.i++; if (L.i >= L.cola.length) return fin();
  pintaEjercicio(); window.scrollTo({top: 0});
}
function sinVidas() {
  $('app').innerHTML = `<div class="fin mal"><div class="grande">💔</div><h1>Te has quedado sin vidas</h1><p>No pasa nada: repasa y vuelve a intentarlo. Los ejercicios que has fallado se guardan para que los repases.</p><button class="btn" id="otra" type="button">Intentarlo de nuevo</button><button class="btn blanco" id="volver" type="button">Volver al camino</button></div>`;
  const {tipo, ti, li} = L; $('otra').onclick = () => empieza(tipo, ti, li); $('volver').onclick = verCamino;
}
function fin() {
  const perfecta = L.primeras === L.n, xp = (L.tipo === 'leccion' ? 10 : 8) + (perfecta ? 5 : 0), seg = Math.round((Date.now() - L.t0) / 1000);
  PROG.xp += xp; sumaRacha();
  if (L.tipo === 'leccion') PROG.hechas[`${B.temas[L.ti].id}:${L.li}`] = Date.now();
  if (L.tipo === 'repaso') PROG.hechas[`${B.temas[L.ti].id}:R`] = Date.now();
  guardaProg(); envia(xp, seg);
  const tit = perfecta ? '¡Lección perfecta!' : '¡Lección completada!', min = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`;
  $('app').innerHTML = `<div class="fin"><div class="grande">${perfecta ? '🏆' : '⭐'}</div><h1>${tit}</h1>
    <div class="res"><div><small>XP</small><b>+${xp}</b></div><div><small>A LA PRIMERA</small><b>${Math.round(L.primeras / L.n * 100)} %</b></div><div><small>TIEMPO</small><b>${min}</b></div></div>
    <p>🔥 Racha: ${PROG.racha.dias} día${PROG.racha.dias === 1 ? '' : 's'}</p><button class="btn verde" id="cont" type="button">Continuar</button></div>`;
  $('cont').onclick = verCamino; $('cont').focus();
}
/* resultados al profesor (solo si el banco lo pide): se envían como texto para no depender de CORS */
function envia(xp, seg) {
  if (!B.resultados || PREVIA) return;
  const t = L.ti != null ? B.temas[L.ti] : null;
  const datos = {banco: BID, titulo: B.titulo, alumno: LSG('alumno', ''), tipo: L.tipo, tema: t?.titulo || 'Repaso de fallos', leccion: L.li === 'R' ? 'Repaso' : L.li != null ? L.li + 1 : '', ejercicios: L.n, aciertosPrimera: L.primeras, fallados: [...L.fallados], xp, segundos: seg, fecha: new Date().toISOString()};
  try { fetch(B.resultados, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(datos)}).catch(() => {}); } catch {}
}
document.addEventListener('keydown', e => {
  if (!L || !EJ || $('mNombre').hidden === false) return;
  if (e.key === 'Enter') { const a = $('accion'); if (a && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); a.click(); } return; }
  if (/^[1-6]$/.test(e.key) && !EJ.hecho && ['mc', 'imagen', 'completar', 'vf'].includes(EJ.q.tipo)) { const btns = [...$('cuerpo').querySelectorAll('[data-o]')], b = btns[+e.key - 1]; if (b) b.click(); }
});

/* ══ Arranque: ?banco=nombre · ?vista=previa · sin parámetros, la biblioteca ══ */
function error(msg) { $('barra').hidden = true; $('app').innerHTML = `<div class="fin mal"><div class="grande">🤔</div><h1>No se ha podido abrir</h1><p>${esc(msg)}</p><button class="btn" id="aLib" type="button">Ver la biblioteca</button></div>`; $('aLib').onclick = () => { history.pushState(null, '', location.pathname); verBiblioteca(); }; }
async function inicio() {
  const q = new URLSearchParams(location.search), nombre = q.get('banco');
  if (q.get('vista') === 'previa') {
    PREVIA = true;
    try {
      const db = await new Promise((ok, ko) => { const r = indexedDB.open('practica-vista', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      const j = await new Promise((ok, ko) => { const r = db.transaction('kv').objectStore('kv').get('banco'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      if (!j) throw new Error('No hay ninguna vista previa preparada. Pulsa «Vista previa en la app» en el generador.');
      abreBanco(normaliza(j), 'vista-previa', null);
    } catch (e) { error(e.message); }
    return;
  }
  if (nombre) {
    if (!/^[\w-]+$/.test(nombre)) return error('El nombre del banco no es válido.');
    try {
      const base = new URL('../bancos/', location.href), r = await fetch(new URL(nombre + '.json', base), {cache: 'no-cache'});
      if (!r.ok) throw new Error(`No se encontró el banco «${nombre}». Comprueba el enlace con tu profesor.`);
      abreBanco(normaliza(await r.json()), nombre, base);
    } catch (e) { error(e.message.startsWith('No se') || e.message.startsWith('El ') ? e.message : 'No se pudo cargar el banco. Comprueba tu conexión.'); }
    return;
  }
  verBiblioteca();
}
window.addEventListener('popstate', inicio);
inicio();
</script>
