<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00A499">
<title>Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--
  Práctica · app de repaso tipo Duolingo para los bancos de ejercicios que genera Preguntas Test.
  Una sola app para todos los bancos: ?banco=nombre carga bancos/nombre.json. Sin servidor ni IA.
  Tests por tema de N preguntas al azar (por defecto 15), modelo de examen con preguntas de todos los temas,
  repaso de fallos. El progreso de cada alumno se guarda en su navegador.
-->
<style>
:root{
  --c:#00A499; --c-osc:color-mix(in srgb,var(--c) 75%,#000); --c-suave:color-mix(in srgb,var(--c) 13%,#fff);
  --verde:#58CC02; --verde-osc:#58A700; --verde-suave:#D7FFB8; --verde-txt:#3B7A00;
  --rojo:#FF4B4B; --rojo-osc:#EA2B2B; --rojo-suave:#FFDFE0; --rojo-txt:#C42B2B;
  --azul:#1CB0F6; --azul-osc:#1899D6; --azul-suave:#DDF4FF;
  --oro:#FFC800; --oro-osc:#E5A800;
  --borde:#E5E5E5; --borde-osc:#CECECE; --tx:#3C3C3C; --tx2:#777; --fondo:#fff; --gris:#F7F7F7;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo);color:var(--tx);font:700 17px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h2.sec{font-size:22px;font-weight:900;margin:30px 0 12px}
/* botones */
.b3{border:2px solid var(--borde);border-bottom-width:4px;border-radius:16px;background:#fff;padding:12px 16px;font-weight:800;transition:transform .05s,filter .15s;text-align:left}
.b3:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.b3:hover:not(:disabled){filter:brightness(.98)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--c);box-shadow:0 4px 0 var(--c-osc);transition:transform .05s;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.verde{background:var(--verde);box-shadow:0 4px 0 var(--verde-osc)}
.btn.rojo{background:var(--rojo);box-shadow:0 4px 0 var(--rojo-osc)}
.btn.azul{background:var(--azul);box-shadow:0 4px 0 var(--azul-osc)}
.btn.gris{background:#E5E5E5;color:#AFAFAF;box-shadow:0 4px 0 #CECECE;cursor:not-allowed}
.btn.blanco{background:#fff;color:var(--azul);border:2px solid var(--borde);box-shadow:0 4px 0 var(--borde)}
.btn.ancho{width:100%}

/* barra superior */
.barra{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--borde)}
.barra .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.barra .tit{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.barra .tit b{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .ico{font-size:28px;line-height:1}
.chipst{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;white-space:nowrap}
.chipst.racha{color:#FF9600}.chipst.xp{color:var(--azul)}
.ibtn{background:none;border:0;padding:6px 8px;border-radius:10px;font-size:20px;line-height:1}
.ibtn:hover{background:#F2F2F2}

/* biblioteca */
.hero{padding:34px 0 8px;text-align:center}
.hero h1{font-size:32px;font-weight:900;margin:0 0 6px}
.hero p{color:var(--tx2);margin:0}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;padding:22px 0 30px}
.banco{display:flex;gap:14px;align-items:center;width:100%;padding:16px;text-decoration:none;color:inherit}
.banco .bi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--bc-s);flex:none}
.banco b{display:block;font-size:18px;line-height:1.25}
.banco span{display:block;color:var(--tx2);font-size:14.5px;font-weight:700}
.vacio{color:var(--tx2);text-align:center;padding:24px 0;grid-column:1/-1}

/* pantalla del banco */
.aviso{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--azul-suave);color:#1172A6;font-size:15px}
.cabeza{display:flex;gap:18px;align-items:center;padding:26px 0 6px;flex-wrap:wrap}
.cabeza .bi{width:72px;height:72px;border-radius:20px;background:var(--c-suave);display:grid;place-items:center;font-size:40px;flex:none}
.cabeza h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:900;line-height:1.15}
.cabeza p{margin:4px 0 0;color:var(--tx2)}
.cabeza .txt{flex:1;min-width:220px}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.resumen span{background:var(--gris);border-radius:99px;padding:6px 12px;font-size:14.5px}
.acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:22px}
.card{border:2px solid var(--borde);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff}
.card.examen{border-color:color-mix(in srgb,var(--c) 45%,#fff);background:var(--c-suave)}
.card.fallos{border-color:#FFC1C1;background:#FFF5F5}
.card .ct{display:flex;gap:14px;align-items:center}
.card .ct .e{font-size:38px;line-height:1}
.card h3{margin:0;font-size:20px;font-weight:900;line-height:1.2}
.card p{margin:0;color:var(--tx2);font-size:15px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{border:2px solid var(--borde);border-bottom-width:4px;border-radius:12px;background:#fff;padding:7px 14px;font-weight:900;font-size:15px}
.seg[aria-pressed="true"]{border-color:var(--azul);color:var(--azul-osc);background:var(--azul-suave)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--c)}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.tema .num{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--c)}
.tema h3{font-size:18.5px}
.barrap{height:12px;border-radius:99px;background:#E5E5E5;overflow:hidden}
.barrap span{display:block;height:100%;background:var(--c);border-radius:99px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--tx2);flex-wrap:wrap}
.card .btn{margin-top:auto}
.historial{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.hfila{display:flex;gap:12px;align-items:center;border:2px solid var(--borde);border-radius:14px;padding:10px 14px;font-size:15px}
.hfila .nota{font-size:19px;font-weight:900;min-width:52px;text-align:center}
.hfila .nota.ap{color:var(--verde-txt)}.hfila .nota.su{color:var(--rojo-txt)}
.hfila .q{flex:1;min-width:0}
.hfila small{display:block;color:var(--tx2);font-size:13px}
.pieweb{color:#AFAFAF;font-size:13px;text-align:center;padding:24px 0 34px;font-weight:700}

/* test */
.lec{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:18px 16px 8px;max-width:900px;margin:0 auto;width:100%}
.pbar{flex:1;height:16px;border-radius:99px;background:#E5E5E5;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.cont{font-weight:900;font-size:16px;color:var(--tx2);white-space:nowrap}
.cuerpo{flex:1;width:100%;max-width:820px;margin:0 auto;padding:18px 16px 210px;display:flex;flex-direction:column;gap:18px}
.etq{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--c);text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap}
.etq .tm{color:var(--tx2)}
.niv{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12px;letter-spacing:.06em}
.niv.n0{background:var(--verde-suave);color:var(--verde-txt)}.niv.n1{background:#FFF1CC;color:#9A6B00}.niv.n2{background:var(--rojo-suave);color:var(--rojo-txt)}
.enun{font-size:clamp(20px,2.6vw,25px);font-weight:900;margin:0;line-height:1.3}
.img{align-self:center;max-width:100%;max-height:min(42vh,340px);border-radius:16px;border:2px solid var(--borde);background:#fff}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.opts.dos{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:center;width:100%;font-size:17px}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--borde);display:grid;place-items:center;font-size:14px;color:var(--tx2);flex:none}
.opt.sel,.par.sel{border-color:#84D8FF;background:var(--azul-suave);color:#1899D6}
.opt.sel .k{border-color:#84D8FF;color:#1899D6}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-size:19px;padding:18px}
.tarjeta{border:2px solid var(--borde);border-radius:16px;padding:18px;font-size:19px}
.frase{font-size:clamp(19px,2.4vw,22px);line-height:2;margin:0}
.hueco{display:inline-block;min-width:110px;border-bottom:3px solid var(--borde-osc);text-align:center;padding:0 8px;line-height:1.5;cursor:pointer}
.hueco.lleno{border:2px solid var(--borde);border-bottom-width:4px;border-radius:12px;padding:2px 12px;color:#1899D6;background:var(--azul-suave)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;font-size:17px}
.chip.usado{visibility:hidden}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pares .col{display:flex;flex-direction:column;gap:12px}
.par{width:100%;font-size:15.5px;padding:12px;text-align:center;min-height:58px}
.par.ok{border-color:var(--verde);background:var(--verde-suave);color:var(--verde-txt);opacity:.6;cursor:default}
.par.mal{border-color:var(--rojo);background:var(--rojo-suave);color:var(--rojo-txt);animation:tiembla .35s}
@keyframes tiembla{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.zona{min-height:120px;border-top:2px solid var(--borde);border-bottom:2px solid var(--borde);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.zona:empty::before{content:"Pulsa los pasos en el orden correcto";color:#AFAFAF;font-weight:700;text-align:center;padding-top:30px}
.paso{display:flex;gap:10px;align-items:center;width:100%;font-size:16px;padding:10px 14px}
.paso .n{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.banco-pasos{display:flex;flex-direction:column;gap:8px}
.pie{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--borde);background:#fff;z-index:30}
.pie .in{max-width:900px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pie.ok{background:var(--verde-suave);border-top-color:transparent}
.pie.mal{background:var(--rojo-suave);border-top-color:transparent}
.pie h3{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.pie.ok h3,.pie.ok .sol{color:var(--verde-txt)}
.pie.mal h3,.pie.mal .sol{color:var(--rojo-txt)}
.pie .sol{font-size:16px;margin:0}
.pie .exp{font-size:15px;margin:0;color:var(--tx);font-weight:700;opacity:.85}
.pie ol,.pie ul{margin:4px 0 0;padding-left:1.3em}
@media(min-width:700px){.pie .in{flex-direction:row;align-items:center;justify-content:space-between}.pie .in .txt{flex:1}.pie .btn{min-width:200px}}
/* resultado */
.fin{max-width:760px;margin:0 auto;padding:32px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.fin .grande{font-size:84px;line-height:1;animation:bota .7s ease-out}
@keyframes bota{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.fin h1{margin:0;font-size:30px;font-weight:900;color:var(--verde-osc)}
.fin.su h1{color:var(--rojo-osc)}
.fin p{margin:0;color:var(--tx2)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:520px}
.res div{border:2px solid var(--borde);border-radius:16px;overflow:hidden}
.res small{display:block;background:var(--c);color:#fff;font-size:12.5px;font-weight:900;letter-spacing:.06em;padding:5px}
.res b{display:block;font-size:24px;padding:10px 4px}
.fin .botones{display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px}
.revision{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.revision h2{font-size:21px;font-weight:900;margin:0}
.rev{border:2px solid var(--borde);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.rev.mal{border-color:#FFC1C1;background:#FFF8F8}
.rev .e{font-weight:900}
.rev .tu{color:var(--rojo-txt)}.rev .bien{color:var(--verde-txt)}
.rev .x{color:var(--tx2);font-size:14.5px}
.rev ul,.rev ol{margin:0;padding-left:1.3em}
/* modal y avisos */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:20px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.mbox h2{margin:0;font-size:22px;font-weight:900}
.mbox p{margin:0;color:var(--tx2)}
.mbox input{font:700 17px var(--f);padding:12px 14px;border:2px solid var(--borde);border-radius:14px;width:100%}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#4B4B4B;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:15px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header class="barra" id="barra" hidden><div class="wrap">
  <button class="ibtn" id="aBiblio" type="button" aria-label="Volver a la biblioteca">←</button>
  <div class="tit"><span class="ico" id="bIco"></span><b id="bTit"></b></div>
  <span class="chipst racha" id="sRacha" title="Días seguidos practicando"></span>
  <span class="chipst xp" id="sXp" title="Puntos de experiencia"></span>
  <button class="ibtn" id="bSonido" type="button" aria-label="Sonido"></button>
</div></header>
<main id="app"></main>
<div class="modal" id="mNombre" hidden><div class="mbox" role="dialog" aria-labelledby="mNt">
  <h2 id="mNt">¿Cómo te llamas?</h2><p>Tu profesor recibirá el resultado de cada test con este nombre.</p>
  <input type="text" id="inNombre" maxlength="60" autocomplete="name" placeholder="Nombre y apellidos">
  <button class="btn ancho" id="okNombre" type="button">Continuar</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* pide siempre la versión recién publicada, saltándose la caché de GitHub Pages */
const fresco = u => { const x = new URL(u); x.searchParams.set('v', Date.now()); return x; };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
const LSG = (k, d) => { try { const v = localStorage.getItem('practica_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const LSS = (k, v) => { try { localStorage.setItem('practica_' + k, JSON.stringify(v)); } catch {} };
let _tt; function toast(m, ms = 2600) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(_tt); _tt = setTimeout(() => t.hidden = true, ms); }
const dia = d => d.toLocaleDateString('sv-SE');
const nota10 = (a, n) => n ? Math.round(a / n * 100) / 10 : 0;
const fmtNota = x => x.toLocaleString('es-ES', {maximumFractionDigits: 1});
/* reparto entero proporcional (resto mayor) */
function reparto(pesos, total) { const W = pesos.reduce((a, b) => a + b, 0) || 1, ideal = pesos.map(p => total * p / W), out = ideal.map(Math.floor); let r = total - out.reduce((a, b) => a + b, 0); ideal.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (r > 0) { out[i]++; r--; } }); return out; }

/* ── banco y progreso ── */
let B = null, BID = '', BASE = null, PROG = null, L = null, EJ = null, PREVIA = false;
const TIPO = {opcion_multiple: 'mc', verdadero_falso: 'vf', completar: 'completar', emparejar: 'emparejar', ordenar: 'ordenar', imagen: 'imagen', mc: 'mc', vf: 'vf'};
function valido(q) {
  if (['mc', 'imagen', 'completar', 'vf'].includes(q.tipo)) return Array.isArray(q.opciones) && q.opciones.length >= 2 && Number.isInteger(q.correcta) && q.correcta >= 0 && q.correcta < q.opciones.length && (q.tipo !== 'completar' || String(q.frase || '').includes('___')) && (q.tipo !== 'imagen' || !!q.imagen);
  if (q.tipo === 'emparejar') return Array.isArray(q.pares) && q.pares.length >= 2 && q.pares.every(p => p && p.a && p.b);
  if (q.tipo === 'ordenar') return Array.isArray(q.pasos) && q.pasos.length >= 2;
  return false;
}
function normaliza(j) {
  if (j?.formato !== 'banco-preguntas' || !Array.isArray(j.temas)) throw new Error('El archivo no es un banco de ejercicios válido.');
  const p = j.presentacion || {};
  const temas = j.temas.map((t, i) => ({id: String(t.id || 't' + i), titulo: t.titulo || `Tema ${i + 1}`, ej: (t.ejercicios || t.preguntas || []).map((q, k) => ({...q, id: String(q.id || `${i}-${k}`), tipo: TIPO[q.tipo] || 'mc'})).filter(valido)})).filter(t => t.ej.length);
  if (!temas.length) throw new Error('El banco no tiene ejercicios.');
  temas.forEach(t => t.ej.forEach(q => q.tid = t.id));
  return {titulo: p.titulo || j.libro?.titulo || 'Banco de ejercicios', descripcion: p.descripcion || '', icono: p.icono || '📘', color: /^#[0-9a-f]{6}$/i.test(p.color || '') ? p.color : '#00A499',
    porTest: Math.min(50, Math.max(5, +(p.porTest || 15))), temas, imagenes: j.imagenes || {}, resultados: /^https:\/\//.test(j.resultados?.url || '') ? j.resultados.url : ''};
}
const srcImg = id => { const s = B.imagenes[id] || id; if (/^data:image\//.test(s)) return s; try { return new URL(s, BASE || location.href).href; } catch { return ''; } };
const todos = () => B.temas.flatMap(t => t.ej);
const temaDe = q => B.temas.find(t => t.id === q.tid);
const guardaProg = () => LSS('prog_' + BID, PROG);
function racha() { const r = PROG.racha, hoy = dia(new Date()), ayer = dia(new Date(Date.now() - 864e5)); return r.ultimo === hoy || r.ultimo === ayer ? r.dias : 0; }
function sumaRacha() { const r = PROG.racha, hoy = dia(new Date()), ayer = dia(new Date(Date.now() - 864e5)); if (r.ultimo === hoy) return; r.dias = r.ultimo === ayer ? r.dias + 1 : 1; r.ultimo = hoy; }
const fallosVivos = () => { const ids = new Set(todos().map(q => q.id)); return PROG.fallos.filter(id => ids.has(id)); };
const dominadas = t => t.ej.filter(q => PROG.vistas[q.id]?.a === true).length;
/* selección al azar por niveles: primero las que nunca han salido, después las falladas y por último las menos repetidas;
   dentro de cada nivel, al azar. Así, con 200 preguntas por tema, en unos 14 tests de 15 han salido todas. */
/* test por tema: 15 preguntas (o las que haya) con la dificultad en escalera.
   Cuota 40 % fáciles, 40 % medias, 20 % difíciles (15 → 6 + 6 + 3); si falta de un nivel se completa con medias y después
   con fáciles, para que las difíciles sean siempre las menos. Orden: fáciles, medias y difíciles, al azar dentro de cada nivel. */
const nivelDe = q => q.dificultad === 'facil' ? 0 : q.dificultad === 'dificil' ? 2 : 1;
function eligeTema(t, n) {
  const grupos = [0, 1, 2].map(k => t.ej.filter(q => nivelDe(q) === k)), cuota = [Math.round(n * 0.4), 0, Math.round(n * 0.2)]; cuota[1] = n - cuota[0] - cuota[2];
  const sel = grupos.map((g, k) => eligeAleatorias(g, Math.min(cuota[k], g.length)));
  let falta = n - sel.reduce((a, g) => a + g.length, 0);
  for (const k of [1, 0, 2]) { if (falta <= 0) break; const extra = eligeAleatorias(grupos[k].filter(q => !sel[k].includes(q)), falta); sel[k].push(...extra); falta -= extra.length; }
  return sel.flatMap(g => shuffle(g));
}
function eligeAleatorias(pool, n) {
  const nivel = q => { const v = PROG.vistas[q.id]; return !v ? 0 : v.a === false ? 1 : 2 + v.v; };
  return pool.map(q => [nivel(q), Math.random(), q]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, n).map(x => x[2]);
}

    const enun = q.tipo === 'completar' ? String(q.frase).replace('___', '_____') : q.enunciado;
    const tuya = Array.isArray(tu) ? `<ol class="tu">${tu.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : tu ? `<span class="tu">Tu respuesta: ${esc(tu)}</span>` : '';
    const sol = q.tipo === 'ordenar' ? `<span class="bien">Orden correcto:</span><ol class="bien">${q.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : q.tipo === 'emparejar' ? `<span class="bien">Parejas correctas:</span><ul class="bien">${q.pares.map(p => `<li>${esc(p.a)} → ${esc(p.b)}</li>`).join('')}</ul>` : `<span class="bien">Correcta: ${esc(q.opciones[q.correcta])}</span>`;
    return `<div class="rev mal"><span class="e">${esc(enun)}</span>${tuya}${sol}${q.explicacion ? `<span class="x">${esc(q.explicacion)}</span>` : ''}</div>`;
  }).join('')}</div>`;
}
function fin() {
  const nota = nota10(L.aciertos, L.n), seg = Math.round((Date.now() - L.t0) / 1000), xp = L.aciertos * 2 + (nota >= 9 ? 5 : 0);
  PROG.xp += xp; sumaRacha();
  if (L.modo === 'tema') { const t = B.temas[L.ti], st = PROG.temas[t.id] || (PROG.temas[t.id] = {tests: 0, mejor: 0}); st.tests++; st.mejor = Math.max(st.mejor, nota); }
  PROG.historial = [...PROG.historial, {modo: L.modo, titulo: L.titulo, n: L.n, aciertos: L.aciertos, nota, fecha: new Date().toISOString(), seg}].slice(-50);
  guardaProg(); envia(nota, xp, seg);
  const ap = nota >= 5, emoji = nota >= 9 ? '🏆' : ap ? '⭐' : '💪', tit = nota === 10 ? '¡Perfecto!' : nota >= 9 ? '¡Excelente!' : ap ? '¡Aprobado!' : 'Sigue practicando', min = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`;
  $('app').innerHTML = `<div class="fin${ap ? '' : ' su'}"><div class="grande">${emoji}</div><h1>${tit}</h1><p>${esc(L.titulo)}</p>
    <div class="res"><div><small>NOTA</small><b>${fmtNota(nota)}</b></div><div><small>ACIERTOS</small><b>${L.aciertos}/${L.n}</b></div><div><small>TIEMPO</small><b>${min}</b></div></div>
    <p>⚡ +${xp} XP · 🔥 Racha: ${PROG.racha.dias} día${PROG.racha.dias === 1 ? '' : 's'}</p>
    <div class="botones"><button class="btn verde" id="otro" type="button">${L.modo === 'examen' ? 'Otro examen' : L.modo === 'fallos' ? 'Repasar más fallos' : 'Otro test de este tema'}</button><button class="btn blanco" id="volver" type="button">Volver</button></div>
    ${revisionHTML()}</div>`;
  const {modo, ti} = L; window.scrollTo({top: 0});
  $('otro').onclick = () => { if (modo === 'fallos' && !fallosVivos().length) { toast('¡No te quedan fallos por repasar!'); verBanco(); return; } empieza(modo, ti); };
  $('volver').onclick = verBanco; $('otro').focus();
}
/* resultados al profesor (solo si el banco lo pide): se envían como texto para no depender de CORS */
function envia(nota, xp, seg) {
  if (!B.resultados || PREVIA) return;
  const datos = {banco: BID, titulo: B.titulo, alumno: LSG('alumno', ''), modo: L.modo, tema: L.modo === 'tema' ? B.temas[L.ti].titulo : L.titulo, preguntas: L.n, aciertos: L.aciertos, nota, fallados: L.res.filter(r => !r.ok).map(r => r.q.id), xp, segundos: seg, fecha: new Date().toISOString()};
  try { fetch(B.resultados, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(datos)}).catch(() => {}); } catch {}
}
document.addEventListener('keydown', e => {
  if (!L || !EJ || $('mNombre').hidden === false || !$('cuerpo')) return;
  if (e.key === 'Enter') { const a = $('accion'); if (a && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); a.click(); } return; }
  if (/^[1-6]$/.test(e.key) && !EJ.hecho && ['mc', 'imagen', 'completar', 'vf'].includes(EJ.q.tipo)) { const b = [...$('cuerpo').querySelectorAll('[data-o]')][+e.key - 1]; if (b) b.click(); }
});

/* ══ Arranque: ?banco=nombre · ?vista=previa · sin parámetros, la biblioteca ══ */
function error(msg) { $('barra').hidden = true; $('app').innerHTML = `<div class="fin su"><div class="grande">🤔</div><h1>No se ha podido abrir</h1><p>${esc(msg)}</p><div class="botones"><button class="btn" id="aLib" type="button">Ver la biblioteca</button></div></div>`; $('aLib').onclick = () => { history.pushState(null, '', location.pathname); verBiblioteca(); }; }
async function inicio() {
  const q = new URLSearchParams(location.search), nombre = q.get('banco');
  if (q.get('vista') === 'previa') {
    PREVIA = true;
    try {
      const db = await new Promise((ok, ko) => { const r = indexedDB.open('practica-vista', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      const j = await new Promise((ok, ko) => { const r = db.transaction('kv').objectStore('kv').get('banco'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      if (!j) throw new Error('No hay ninguna vista previa preparada. Pulsa «Vista previa en la app» en el generador.');
      abreBanco(normaliza(j), 'vista-previa', null);
    } catch (e) { error(e.message); }
    return;
  }
  if (nombre) {
    if (!/^[\w-]+$/.test(nombre)) return error('El nombre del banco no es válido.');
    /* solo se abren los bancos del catálogo que el profesor tiene visibles */
    let cat = null; try { const r = await fetch(fresco(new URL('../bancos/index.json', location.href)), {cache: 'no-store'}); if (r.ok) cat = (await r.json()).bancos || []; } catch {}
    if (cat) { const e = cat.find(b => b && b.archivo === nombre); if (!e || e.visible === false) return error('Este banco no está disponible ahora mismo. Pregunta a tu profesor.'); }
    try {
      const base = new URL('../bancos/', location.href), r = await fetch(fresco(new URL(nombre + '.json', base)), {cache: 'no-store'});
      if (!r.ok) throw new Error(`No se encontró el banco «${nombre}». Comprueba el enlace con tu profesor.`);
      abreBanco(normaliza(await r.json()), nombre, base);
    } catch (e) { error(e.message.startsWith('No se') || e.message.startsWith('El ') ? e.message : 'No se pudo cargar el banco. Comprueba tu conexión.'); }
    return;
  }
  verBiblioteca();
}
window.addEventListener('popstate', inicio);
inicio();
</script>
